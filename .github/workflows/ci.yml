name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ECommerce.API.slnx

      - name: Build
        run: dotnet build ECommerce.API.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ECommerce.API.slnx --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f ECommerce.API/Dockerfile -t ecommerce-api:ci .
